<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Sandip K Mishra - Senior DevSecOps Engineer and Cloud Architect">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F294A"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
    <radialGradient id="glowCyan" cx="82%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="18%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="14" fill="url(#glowCyan)"/>
  <rect width="1200" height="260" rx="14" fill="url(#glowPurple)"/>
  <rect x="1" y="1" width="1198" height="258" rx="13" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Subtle Architecture Topology Graphic (Right Side) -->
  <g stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="930" y1="65" x2="1030" y2="110"/>
    <line x1="930" y1="65" x2="1090" y2="60"/>
    <line x1="1030" y1="110" x2="1125" y2="145"/>
    <line x1="1030" y1="110" x2="965" y2="175"/>
    <line x1="965" y1="175" x2="1085" y2="195"/>
    <line x1="1090" y1="60" x2="1125" y2="145"/>
  </g>
  <g>
    <circle cx="930" cy="65" r="6" fill="#00E5FF" fill-opacity="0.85"/>
    <circle cx="1090" cy="60" r="5" fill="#7C3AED" fill-opacity="0.9"/>
    <circle cx="1030" cy="110" r="8" fill="#0A192F" stroke="#00E5FF" stroke-width="2.2"/>
    <circle cx="1030" cy="110" r="3" fill="#00E5FF"/>
    <circle cx="1125" cy="145" r="5.5" fill="#10B981" fill-opacity="0.85"/>
    <circle cx="965" cy="175" r="6" fill="#38BDF8" fill-opacity="0.85"/>
    <circle cx="1085" cy="195" r="5" fill="#A855F7" fill-opacity="0.85"/>
  </g>

  <!-- Top Control Plane Status Label -->
  <rect x="56" y="34" width="275" height="26" rx="13" fill="#0F294A" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="74" cy="47" r="4" fill="#10B981"/>
  <text x="88" y="51.5" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2">CLOUD &amp; AI CONTROL PLANE</text>

  <!-- Main Name -->
  <text x="56" y="122" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">Sandip K Mishra</text>

  <!-- Subtitle -->
  <text x="56" y="160" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="500" fill="#CBD5E1">Senior DevSecOps Engineer &amp; Cloud Architect  ·  Agentic AI Systems</text>

  <!-- Accent Divider -->
  <rect x="56" y="182" width="680" height="2" fill="url(#accentLine)"/>

  <!-- Pillar Pills -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="56" y="200" width="112" height="28" rx="6" fill="#0B1F3A" stroke="#0078D4" stroke-width="1"/>
    <text x="112" y="218" text-anchor="middle" fill="#60A5FA">AZURE CAF</text>

    <rect x="180" y="200" width="128" height="28" rx="6" fill="#0B1F3A" stroke="#7C3AED" stroke-width="1"/>
    <text x="244" y="218" text-anchor="middle" fill="#C4B5FD">TERRAFORM</text>

    <rect x="320" y="200" width="122" height="28" rx="6" fill="#052E16" stroke="#10B981" stroke-width="1"/>
    <text x="381" y="218" text-anchor="middle" fill="#6EE7B7">DEVSECOPS</text>

    <rect x="454" y="200" width="126" height="28" rx="6" fill="#2E1065" stroke="#A855F7" stroke-width="1"/>
    <text x="517" y="218" text-anchor="middle" fill="#E9D5FF">MCP &amp; RAG</text>

    <rect x="592" y="200" width="102" height="28" rx="6" fill="#0B1F3A" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1"/>
    <text x="643" y="218" text-anchor="middle" fill="#67E8F9">FINOPS</text>
  </g>
</svg>
